contracts:
  - id: QUOTA-SEMANTICS-002
    title: The displayed number is the remaining weekly percentage
    status: active
    statement: The app-server source first selects the explicit codex bucket when present and otherwise accepts only a base or unidentified legacy bucket. The menu bar prefers a window classified as weekly and displays 100 minus its clamped used percentage, rounded to the nearest integer. Missing data is shown as an em dash and is never fabricated from another window.
    rationale: Users need one stable number whose meaning does not change when the endpoint returns multiple windows.
    source: user-confirmed
    owner: project-maintainer
    risk: medium
    scope:
      include: [usage-parsing, menu-bar]
      exclude: [cost-estimation, reset-credit-redemption]
    examples:
      positive: A weekly used value of 31.6 produces 68% in the menu bar.
      negative: A five-hour rolling window is presented as weekly quota.
    guards:
      - Tests/CodexWatchTests/AuditRegressionTests.swift
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - Tests/CodexWatchTests/UsageWindowClassifierTests.swift
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
    supersedes: []
    superseded_by: null
    last_verified_commit: 018225f

  - id: PRIVACY-BOUNDARY-003
    title: Credentials and private Codex data remain minimally exposed
    status: active
    statement: The app prefers managed ChatGPT authentication through a local Codex app-server child process and optionally reads only the local auth file through an off-main, opened-handle read that enforces a one-mebibyte ceiling while consuming bytes. App-server JSONL lines and compatibility HTTPS responses each have a one-mebibyte ceiling. Compatibility credentials go only to the original ChatGPT HTTPS host. Credentials and authenticated responses remain in process memory; child stderr is discarded. The app never contacts an update service, scans sessions, reads prompts, logs sensitive data, caches responses, or stores cookies. Analytics leaves process memory only for a user-confirmed CSV. Notification text contains no quota value, and copied diagnostics contain operational state only.
    rationale: The app handles an access token and must minimize both data access and exfiltration paths.
    source: security-review
    owner: project-maintainer
    risk: critical
    scope:
      include: [auth-reader, usage-client, network-session]
      exclude: [conversation-monitoring, telemetry, automatic-download, automatic-install]
    examples:
      positive: Bounded app-server messages obtain official account state, ephemeral bounded GET requests obtain richer analytics when file credentials are available, and a CSV is written only after the user confirms a save destination.
      negative: A rollout JSONL file is parsed, an authenticated redirect is followed to another host, or analytics is cached automatically on disk.
    guards:
      - Tests/CodexWatchTests/AppServer/ProcessAppServerLineTransportTests.swift
      - Tests/CodexWatchTests/AuditRegressionTests.swift
      - Tests/CodexWatchTests/CodexAuthReaderTests.swift
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
      - Tests/CodexWatchTests/UsageAnalyticsCSVExporterTests.swift
      - "manual: sensitive string and executable dependency review"
    supersedes: []
    superseded_by: null
    last_verified_commit: 018225f

  - id: PACKAGE-RELEASE-004
    title: Version tags produce verified GitHub release artifacts
    status: active
    statement: A vMAJOR.MINOR.PATCH tag matching Info.plist triggers CI to test, run the release-script regression harness, compile with complete strict-concurrency warnings as errors, build once per requested architecture set, verify, archive, extract into a unique temporary directory, verify the exact extracted app, checksum, and publish. The release workflow must use pinned actions and must not upload credentials or local Codex data.
    rationale: Tag-driven builds reduce the risk of a manually substituted binary and make the source-to-release path reviewable.
    source: security-review
    owner: project-maintainer
    risk: high
    scope:
      include: [ci, packaging, github-release]
      exclude: [apple-notarization-without-credentials]
    examples:
      positive: Pushing v0.2.0 creates a universal ZIP and SHA-256 file after verification passes.
      negative: A release asset is uploaded manually from an unverified local build.
    guards:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - scripts/check_release.sh
      - scripts/release.sh
      - scripts/verify_app.sh
    supersedes: []
    superseded_by: null
    last_verified_commit: 018225f

  - id: MENU-PROGRESS-005
    title: The status menu visualizes quota and exact time windows
    status: active
    statement: The top of the status menu contains two always-present labeled native progress bars for weekly quota and weekly reset, plus a reset-credit expiry bar when exact grant and expiry metadata is available. The quota bar is the clamped remaining weekly percentage. Each time bar is the clamped time remaining divided by its exact server-provided duration. Text labels preserve the numeric meaning, and missing metadata never produces an assumed progress value. Opening the menu rebuilds time-dependent labels from current time without requiring a network fetch. Reset date and pace share one line separated by an em dash; the exhaustion line uses the label Exhaustion. Custom menu height follows visible content.
    rationale: Remaining-state bars make quota capacity and renewal or expiry timing scannable while keeping each calculation truthful and accessible.
    source: user-confirmed
    owner: project-maintainer
    risk: medium
    scope:
      include: [status-menu, usage-parsing, accessibility]
      exclude: [quota-prediction, hardcoded-reset-window, additional-network-data]
    examples:
      positive: With 81 percent quota remaining, two days left in a seven-day weekly window, and 20 days left in a 30-day reset-credit lifetime, the bars show 81 percent, two sevenths, and two thirds remaining.
      negative: A time bar assumes a weekly or reset-credit duration when the endpoint omits the required metadata.
    guards:
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
      - "manual: inspect all available progress bars and labels in the open menu on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: 018225f

  - id: RESET-CREDITS-006
    title: Available rate-limit reset credits are shown without fabrication
    status: active
    statement: When either validated source includes a nonnegative available reset-credit count, the status menu displays that count separately. File-based compatibility may make a best-effort same-host read for expiry details; app-server responses may provide documented credit inventory directly. Exact grant and expiry values may drive a clamped lifetime bar, but missing metadata never creates an assumed duration. When an app-server credit is available, Use Reset Credit requires confirmation, sends one UUID idempotency key and optional documented credit ID, retains an uncertain request only in memory for safe retry, clears it only on an exact outcome, and refetches quota after every exact outcome. The app never redeems automatically or merges reset credits with the weekly automatic reset.
    rationale: Reset credits are useful actionable quota information, including when the next one will expire, but their meaning must remain distinct from the weekly window and absent values must not be misrepresented.
    source: user-confirmed
    owner: project-maintainer
    risk: high
    scope:
      include: [usage-parsing, status-menu, reset-credits]
      exclude: [automatic-credit-redemption, inferred-credit-capacity, non-ChatGPT-network-requests]
    examples:
      positive: Two available credits display as 2 available; a confirmed redemption uses one stable idempotency key across an uncertain retry and refreshes quota after a reset outcome.
      negative: A missing grant time is treated as a fixed 30-day duration, or a credit is consumed in the background without user confirmation.
    guards:
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - Tests/CodexWatchTests/RecommendedFeaturesTests.swift
      - Tests/CodexWatchTests/AppServer/CodexAppServerClientTests.swift
      - "manual: inspect the reset-credit row in the open menu on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: 018225f

  - id: PLAN-DISPLAY-008
    title: The status menu shows only a server-reported recognized ChatGPT plan
    status: active
    statement: The expanded status menu contains an always-present Plan row. Recognized current app-server and compatibility values normalize free, go, plus, pro, prolite, business and team variants, enterprise variants, and edu variants to a bounded display name. Missing, unknown, or changed values display Unavailable; the app never guesses a plan, token allowance, or absolute quota from percentages.
    rationale: The server-reported plan gives useful account context, while fail-closed normalization prevents an internal or changed field from becoming a misleading entitlement claim.
    source: user-confirmed
    owner: project-maintainer
    risk: medium
    scope:
      include: [usage-parsing, status-menu]
      exclude: [hover-popover, token-estimation, plan-sub-tier-inference, additional-network-data]
    examples:
      positive: A plan_type of pro displays Plan and Pro, while prolite displays Plan and Pro Lite, above the weekly quota row.
      negative: An unknown plan is displayed verbatim, or 68 percent remaining is converted into a fabricated token count.
    guards:
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - "manual: inspect the Plan row in the open menu on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: 018225f

  - id: CREDITS-BALANCE-009
    title: The status menu shows the server-reported ChatGPT credits remaining
    status: active
    statement: When credits.has_credits is true and the existing usage response contains a numeric credits.balance value, the expanded status menu displays it in one Credits remaining row. Positive, zero, and negative server-reported balances are preserved. When credits.unlimited is true, the row displays Unlimited instead of a numeric balance. Numeric text must validate in full, not just as a numeric prefix. A missing entitlement, missing or malformed balance, or oversized value hides the row and is never replaced with an assumed zero. No message estimates or other credits metadata are displayed.
    rationale: The server can report a negative balance after concurrent usage depletes credits, while has_credits and unlimited determine whether a numeric balance has the intended meaning.
    source: user-confirmed-and-official-docs
    owner: project-maintainer
    risk: medium
    scope:
      include: [usage-parsing, status-menu, credits-balance]
      exclude: [message-estimates, overage-state, spend-controls, additional-rate-limits]
    examples:
      positive: A credits.balance of -1.25 with has_credits true displays Credits remaining and -1.25, while unlimited true displays Unlimited.
      negative: A missing entitlement displays zero, or approximate message counts are added to the menu.
    guards:
      - Tests/CodexWatchTests/AuditRegressionTests.swift
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - "manual: compare the Credits remaining row with the ChatGPT Usage Dashboard on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: 018225f

  - id: DASHBOARD-SURFACE-011
    title: The menu bar remains persistent with one on-demand native analytics window
    status: active
    statement: Codex Watch remains an LSUIElement app whose persistent control surface is one native NSStatusItem showing the rounded base-weekly percentage. The status menu may open one reusable 940 by 720 resizable native analytics window with 7, 30, 90, and 365 day ranges. The dashboard refresh action invokes the coordinated manual refresh, the heatmap is seven weekday rows by the needed week columns, and wide model and client tables scroll horizontally instead of clipping. The app creates no notch overlay, hidden web view, persistent Dock icon, or duplicate analytics window.
    rationale: A native on-demand window provides enough space for truthful charts, coverage, and model/client tables without returning to screen overlays or embedding browser state.
    source: user-confirmed
    owner: project-maintainer
    risk: medium
    scope:
      include: [menu-bar, status-menu, analytics-window, accessibility]
      exclude: [notch-overlay, webview, persistent-dock-icon, session-state]
    examples:
      positive: Open Analytics Dashboard reuses the existing native window and the menu bar continues to show the unchanged weekly percentage.
      negative: Selecting the action creates another window each time, adds a persistent Dock icon, or replaces the weekly percentage with a model-specific limit.
    guards:
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - Tests/CodexWatchTests/AnalyticsDashboardModelTests.swift
      - Tests/CodexWatchTests/UsageHeatmapLayoutTests.swift
      - Tests/CodexWatchTests/DashboardTableLayoutTests.swift
      - "manual: reopen and resize the analytics window while inspecting the menu bar on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: 018225f

  - id: USAGE-ANALYTICS-012
    title: One bounded server dataset powers truthful Codex analytics projections
    status: active
    statement: Codex Watch requests at most the inclusive trailing 365 calendar days of day-grouped aggregate usage from the authenticated ChatGPT HTTPS host, validates it into an in-memory dataset, and derives 7, 30, 90, and 365 day projections without additional range requests. Token totals aggregate only rows with complete nonnegative token fields. Rows that contain valid turns and threads but omit every token field remain explicitly activity-only, distinct from observed zero-token and missing dates. Model rows report activity and credits, client rows report tokens, comparisons require at least 90 percent token coverage in both periods, and 365 day comparison is unavailable. Unchanged projections are reused only for the same dataset, selected range, calendar, and reference day, in memory. Quota-only updates do not republish unchanged dashboard analytics, and a closed dashboard updates when reopened. A user-requested CSV exports only the selected validated projection.
    rationale: The wider bounded response supplies useful Codex metrics while explicit coverage and activity-only states prevent historical schema differences from becoming fabricated token usage.
    source: user-confirmed-and-live-verified
    owner: project-maintainer
    risk: high
    scope:
      include: [usage-analytics, projection, dashboard, status-menu, csv-export]
      exclude: [session-scanning, lifetime-inference, model-token-inference, pricing, html-scraping]
    examples:
      positive: A day with turns and threads but no token keys contributes to activity totals, exports as Activity only with blank token cells, and does not count toward token coverage.
      negative: Missing token fields are converted to zero, model credits are labeled as tokens, or a 30 day total is fetched with a separate authenticated request.
    guards:
      - Tests/CodexWatchTests/UsageAnalyticsDatasetTests.swift
      - Tests/CodexWatchTests/UsageAnalyticsProjectionTests.swift
      - Tests/CodexWatchTests/AnalyticsDashboardModelTests.swift
      - Tests/CodexWatchTests/UsageAnalyticsCSVExporterTests.swift
      - "manual: compare dashboard ranges and data-through labels with the official Codex analytics page"
    supersedes: []
    superseded_by: null
    last_verified_commit: 018225f

  - id: REFRESH-COORDINATION-013
    title: Refresh work is coordinated, bounded, and user-selectable
    status: active
    statement: A single coordinator owns automatic, manual, menu-open, wake, and app-server rate-limit update triggers. Repeated nonmanual triggers coalesce into active work; manual refresh replaces older work and only the newest generation may publish either partial quota or final analytics; quota publishes without waiting for analytics; authentication failure marks retained analytics stale even on quota-only refreshes; scheduled delays start after completion; shutdown prevents publication. Fixed choices are Manual, 1, 2, 5, 15, and 30 minutes. Adaptive is the fresh-install default, ranges from 2 to 30 minutes based only on menu interaction, and uses 30 minutes during Low Power Mode or serious thermal pressure. Menu opening and rate-limit notifications are quota-only, while automatic analytics attempts remain at least 15 minutes apart.
    rationale: Generation ownership prevents cancellation churn and stale publication while explicit and adaptive choices control freshness without scanning processes, sessions, or user content.
    source: user-confirmed
    owner: project-maintainer
    risk: high
    scope:
      include: [refresh-coordinator, preferences, stale-state, wake-handling]
      exclude: [process-scanning, session-scanning, content-driven-refresh, token-refresh]
    examples:
      positive: Two automatic triggers share one fetch, while a later manual trigger replaces it and is the only generation allowed to update the menu and dashboard.
      negative: A repeating timer cancels a request every minute, a stale generation publishes after manual refresh, or adaptive cadence inspects running Codex processes.
    guards:
      - Tests/CodexWatchTests/AuditRegressionTests.swift
      - Tests/CodexWatchTests/RefreshCoordinatorTests.swift
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - "manual: exercise every refresh-frequency choice and wake behavior on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: 018225f

  - id: PROFILE-LIFETIME-014
    title: Exact Codex profile statistics are separate, bounded, and fail closed
    status: active
    statement: Codex Watch may perform a bounded read-only GET of /backend-api/wham/profiles/me on the existing authenticated ChatGPT HTTPS host and display independently validated server-reported lifetime tokens, peak daily tokens, longest running turn, streaks, daily token buckets, activity insights, and the 50 highest-ranked Codex invocations in a separate Lifetime dashboard tab. Date-only buckets use fixed POSIX Gregorian UTC semantics, only returned buckets are rendered, and their actual first and last observed dates are stated. The request shares the existing analytics cadence, ephemeral no-cookie session, same-host redirect rule, one-mebibyte response ceiling, and in-memory-only retention. Missing or invalid profile fields remain unavailable and are never inferred from the 365-day analytics dataset or local sessions. Quota, profile, and bounded Usage attempts begin together when the analytics cadence is eligible and fail independently; menu-open refreshes remain quota-only. Profile failure preserves quota and bounded Usage analytics, may preserve the last valid in-memory profile as stale, and never blocks the menu bar. The compact menu suppresses retired Codex Spark presentation rows while retaining decoded capabilities and historical analytics. There is no Spark toggle; its obsolete preference is removed at initialization. Adjacent Codex and Spark words in identifiers or titles identify the family, including versioned GPT names and duplicate suffixes; other quota rows and the base-weekly percentage are unaffected. Its persistent 30 Days / Lifetime selector exposes exact lifetime headline values without duplicating the dashboard's detailed visualizations and resizes to the selected section without reserving blank rows. A template pie-chart image and unforced button foreground let macOS render both the status icon and percentage adaptively in light, dark, and selected states.
    rationale: The same-host profile route supplies the exact first-party account totals that bounded historical rows cannot reconstruct, while a distinct surface and independent failure preserve truthful semantics and the narrow privacy boundary.
    source: user-confirmed-and-live-verified
    owner: project-maintainer
    risk: high
    scope:
      include: [profile-statistics, lifetime-dashboard, status-menu, status-icon, network-session]
      exclude: [profile-editing, avatar-loading, session-scanning, lifetime-inference, html-scraping, lifetime-csv]
    examples:
      positive: A server lifetime_tokens value of 30300000000 displays as 30.3B while an absent peak_daily_tokens value displays Unavailable and the weekly menu bar continues to refresh.
      negative: The app adds bounded daily totals to a manual baseline, reads rollout logs, loads a remote avatar, or treats a failed profile request as a quota failure.
    guards:
      - Tests/CodexWatchTests/CodexProfileStatsTests.swift
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
      - Tests/CodexWatchTests/LifetimeDashboardModelTests.swift
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - "manual: compare menu and dashboard Lifetime values with the official Codex profile and inspect the pie icon and percentage in light, dark, and selected states"
    supersedes: []
    superseded_by: null
    last_verified_commit: a628a8c

  - id: DATA-SOURCE-015
    title: Official account APIs are preferred without losing bounded compatibility
    status: active
    statement: Codex Watch locates only an explicit or standard installed Codex executable, launches its experimental app-server command without a shell, completes the documented initialize handshake with experimentalApi disabled over one-mebibyte JSONL lines, times out unanswered requests after 20 seconds, and accepts only documented account response shapes while mapping unknown optional variants to unavailable. Failed connections are cleaned up and replaced after a 30-second retry floor with bounded notification resubscription, shared startup, and account revalidation before operations. Unsupported optional methods preserve a healthy quota connection. Official app-server quota is preferred. Additional bucket windows retain distinct bounded identifiers even when server labels are long or normalize identically; no retired bucket is renamed to a current model. The bounded same-host HTTPS quota path is attempted only when app-server quota is unavailable. Rich compatibility profile data is preferred when available, with official account usage as a reduced lifetime fallback; the trailing 365-day Usage dataset remains compatibility-only. App-server account identity must be ChatGPT, and private thread usage, account email, invocation details from account usage, stderr, and raw responses are ignored. Each capability fails independently and missing sources remain unavailable rather than inferred.
    rationale: Managed Codex authentication supports file, keyring, and automatic credential stores, while a narrow fallback protects the app from an explicitly experimental command and preserves richer bounded analytics.
    source: user-confirmed-and-official-docs
    owner: project-maintainer
    risk: critical
    scope:
      include: [app-server, authentication, quota, lifetime, compatibility-fallback]
      exclude: [shell-execution, websocket-transport, thread-usage, account-email-display, new-network-host]
    examples:
      positive: A keyring-authenticated ChatGPT account receives official weekly quota without reading auth.json, while a file-authenticated account can still receive the richer bounded Usage projection.
      negative: A malformed app-server line is displayed verbatim, an API-key account is treated as ChatGPT, or thread-level usage is retained.
    guards:
      - Tests/CodexWatchTests/AppServer/ProcessAppServerLineTransportTests.swift
      - Tests/CodexWatchTests/AuditRegressionTests.swift
      - Tests/CodexWatchTests/AppServer/AppServerModelsTests.swift
      - Tests/CodexWatchTests/AppServer/CodexAppServerClientTests.swift
      - Tests/CodexWatchTests/AppServer/CodexExecutableLocatorTests.swift
      - Tests/CodexWatchTests/AppServerUsageAdapterTests.swift
      - Tests/CodexWatchTests/CodexAccountServiceTests.swift
      - Tests/CodexWatchTests/CodexDataSourceStrategyTests.swift
    supersedes: []
    superseded_by: null
    last_verified_commit: 018225f

  - id: USER-CONTROLS-016
    title: Notifications and system controls remain explicit and privacy safe
    status: active
    statement: Quota notifications default off, require macOS authorization, fire no more than once per descending 25, 10, 5, and exhausted threshold in a quota window, retain threshold history through corrections within the same reset window, ignore stale data, and contain no quota percentage, account value, or sensitive error text. Launch at Login changes only after the user selects its menu item. Main-menu toggles retain native actions but leave native item state off and convey enabled status with trailing checkmark badges and tooltips, preventing duplicate leading checks and their indentation. Copy Diagnostics writes only app version, quota-source name, current or stale or unavailable capability states, and the two settings states. Reset-credit consumption is separately governed by RESET-CREDITS-006. No control adds telemetry, background analytics persistence, automatic redemption, or an update service.
    rationale: High-value alerts and controls can remain useful without placing private account state on the lock screen, clipboard, disk, or a new network destination.
    source: user-confirmed
    owner: project-maintainer
    risk: high
    scope:
      include: [notifications, launch-at-login, diagnostics, user-preferences]
      exclude: [quota-values-in-notifications, automatic-redemption, telemetry, updater, analytics-persistence]
    examples:
      positive: At 9 percent remaining, an opted-in user receives a generic low-quota alert once, and copied diagnostics report only that quota is current.
      negative: A stale snapshot triggers a lock-screen notification containing 9 percent, or diagnostics copy an account ID, path, token total, or raw error.
    guards:
      - Tests/CodexWatchTests/RecommendedFeaturesTests.swift
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - "manual: authorize notifications, toggle Launch at Login, and inspect copied diagnostics on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: a628a8c
